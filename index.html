<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<title>Weaver's Brain Maze+</title>
<style>
body{margin:0;background:#0b1020;color:#e5e7eb;font-family:system-ui;text-align:center}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0b1020}
#wrap{display:none;justify-content:center;gap:16px;padding:10px}
canvas{background:#000;border-radius:12px}
.panel{background:#111827;padding:10px;border-radius:10px}
button{padding:10px;margin:5px;border:0;border-radius:8px;cursor:pointer}
.primary{background:#22c55e;font-weight:bold}
#infoModal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.8)}
#infoContent{background:#111827;padding:20px;border-radius:12px;width:90%;height:90%;overflow:auto;text-align:left}

#questionBox{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.7)}
#qCard{background:white;color:black;padding:18px;border-radius:12px;width:300px}
</style>
</head>
<body>

<div id="menu">
  <h1>🧠 Weaver's Brain Maze+</h1>
  <h3>Created by Kara Smith</h3>
  <button class="primary" onclick="startGame()">Play</button>
</div>

<div id="wrap">
  <canvas id="game" width="600" height="480"></canvas>
  <div class="panel">
    <div>Level: <b id="level">1</b></div>
    <div>Score: <b id="score">0</b></div>
    <div>Lives: <b id="lives">3</b></div>
    <button onclick="newGame()">Restart</button>
  </div>
</div>

<!-- QUESTION BOX -->
<div id="questionBox">
  <div id="qCard">
    <p id="questionText"></p>
    <div id="answers"></div>
  </div>
</div>

<div id="infoModal">
  <div id="infoContent">
    <h2>How It Works</h2>
    <p>The maze is generated using recursive backtracking.</p>
    <p>Answer questions to unlock doors.</p>
    <button onclick="closeInfo()">Close</button>
  </div>
</div>

<div style="margin:15px">
  <a href="#" onclick="openInfo()" style="color:#22c55e">Read How I Built This</a>
</div>

<script>
let tile=30, cols=20, rows=16;
let maze;
let target={x:1,y:1}, render={x:1,y:1};

const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');

const questionBox=document.getElementById('questionBox');
const questionText=document.getElementById('questionText');
const answers=document.getElementById('answers');

let questions=[
  {q:"Algorithm means?",a:["Step-by-step instructions","Value","String"],c:0},
  {q:"Value means?",a:["A specific piece of data","Algorithm","Boolean"],c:0},
  {q:"Data Type means?",a:["Category of data","Function","Loop"],c:0},
  {q:"Number is?",a:["Numeric data type","String","List"],c:0},
  {q:"String is?",a:["Sequence of characters","Number","Boolean"],c:0},
  {q:"Boolean is?",a:["True/False type","Text","Number"],c:0},
  {q:"Variable is?",a:["Named container","Function","List"],c:0},
  {q:"Assignment Operator means?",a:["= symbol stores value","== comparison","+ operator"],c:0},
  {q:"Variable Assignment is?",a:["Giving variable a value","Deleting variable","Printing output"],c:0},
  {q:"List is?",a:["Ordered collection","Single value","Condition"],c:0},
  {q:"Element is?",a:["Single value in list","List name","Index"],c:0},
  {q:"Index is?",a:["Position starting at 0","Value","Operator"],c:0},
  {q:"Expression is?",a:["Combination producing result","Loop","Event"],c:0},
  {q:"Arithmetic Operators are?",a:["Math symbols","Comparison symbols","Strings"],c:0},
  {q:"Modulus (%) means?",a:["Remainder after division","Addition","Multiplication"],c:0},
  {q:"Comparison Operators are?",a:["Compare values","Assign values","Loop control"],c:0},
  {q:"Logical Operators are?",a:["Combine booleans","Math ops","Strings"],c:0},
  {q:"Concatenation is?",a:["Joining strings","Splitting strings","Counting"],c:0},
  {q:"Condition is?",a:["True/false question","Function","List"],c:0},
  {q:"Conditional Statement is?",a:["Code based on condition","Loop","Variable"],c:0},
  {q:"Counter Pattern is?",a:["Incrementing variable","Deleting variable","Sorting list"],c:0},
  {q:"Function is?",a:["Reusable block","Variable","Event"],c:0},
  {q:"Function Call is?",a:["Executing function","Defining function","Loop"],c:0},
  {q:"Event is?",a:["Action trigger","Data type","Variable"],c:0},
  {q:"Event Handler is?",a:["Code waiting for event","Number","String"],c:0},
  {q:"Action is?",a:["Program response","Variable","List"],c:0},
  {q:"Comment is?",a:["Ignored note","Executable code","Function"],c:0},
  {q:"Debugging is?",a:["Finding/fixing errors","Writing code","Deleting project"],c:0}
];

function generate(){
  let m=Array.from({length:rows},()=>Array(cols).fill(0));
  function carve(x,y){
    let dirs=[[2,0],[-2,0],[0,2],[0,-2]].sort(()=>Math.random()-0.5);
    for(let [dx,dy] of dirs){
      let nx=x+dx,ny=y+dy;
      if(nx>0&&ny>0&&nx<cols-1&&ny<rows-1&&m[ny][nx]===0){
        m[y+dy/2][x+dx/2]=1;
        m[ny][nx]=1;
        carve(nx,ny);
      }
    }
  }
  m[1][1]=1;
  carve(1,1);

  // add doors
  for(let i=0;i<10;i++){
    let x=Math.floor(Math.random()*cols);
    let y=Math.floor(Math.random()*rows);
    if(m[y][x]===1) m[y][x]=2;
  }

  m[rows-2][cols-2]=4;
  return m;
}

function ask(x,y){
  let q=questions[Math.floor(Math.random()*questions.length)];
  questionBox.style.display='flex';
  questionText.textContent=q.q;
  answers.innerHTML='';

  q.a.forEach((ans,i)=>{
    let b=document.createElement('button');
    b.textContent=ans;
    b.onclick=()=>{
      if(i===q.c){
        maze[y][x]=1;
      }
      questionBox.style.display='none';
    };
    answers.appendChild(b);
  });
}

function draw(){
  if(maze){
    render.x+=(target.x-render.x)*0.25;
    render.y+=(target.y-render.y)*0.25;

    ctx.clearRect(0,0,canvas.width,canvas.height);

    for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
      ctx.fillStyle=maze[y][x]===0?"#000":maze[y][x]===4?"green":maze[y][x]===2?"orange":"#444";
      ctx.fillRect(x*tile,y*tile,tile,tile);
    }

    ctx.fillStyle="cyan";
    ctx.fillRect(render.x*tile,render.y*tile,tile,tile);
  }
  requestAnimationFrame(draw);
}

function move(dx,dy){
  let nx=target.x+dx,ny=target.y+dy;
  let tileVal=maze[ny]?.[nx];
  if(tileVal===0||tileVal==null) return;

  if(tileVal===2){
    ask(nx,ny);
    return;
  }

  target.x=nx;
  target.y=ny;
}

function newGame(){
  maze=generate();
  target={x:1,y:1};
  render={x:1,y:1};
}

function startGame(){
  menu.style.display='none';
  wrap.style.display='flex';
  if(!maze) newGame();
}

addEventListener('keydown',e=>{
  if(e.key==='ArrowUp'||e.key==='w')move(0,-1);
  if(e.key==='ArrowDown'||e.key==='s')move(0,1);
  if(e.key==='ArrowLeft'||e.key==='a')move(-1,0);
  if(e.key==='ArrowRight'||e.key==='d')move(1,0);
});

function openInfo(){document.getElementById('infoModal').style.display='flex';}
function closeInfo(){document.getElementById('infoModal').style.display='none';}

const menu=document.getElementById('menu');
const wrap=document.getElementById('wrap');

requestAnimationFrame(draw);
</script>
</body>
</html>
