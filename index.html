<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<title>Weaver's Brain Maze+</title>
<style>
body{margin:0;background:#0b1020;color:#e5e7eb;font-family:system-ui;text-align:center}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0b1020;z-index:10}
#wrap{display:none;justify-content:center;gap:16px;padding:10px}
canvas{background:#000;border-radius:12px}
.panel{background:#111827;padding:10px;border-radius:10px;min-width:140px}
button{padding:10px;margin:5px;border:0;border-radius:8px;cursor:pointer}
.primary{background:#22c55e;font-weight:bold}
#questionBox{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.7);z-index:20}
#qCard{background:white;color:black;padding:18px;border-radius:12px;width:300px}
</style>
</head>
<body>

<div id="menu">
  <h1>🧠 Weaver's Brain Maze+</h1>
  <h3>Created by Kara Smith</h3>
  <button class="primary" onclick="startGame()">Play</button>
</div>

<div id="wrap">
  <canvas id="game"></canvas>
  <div class="panel">
    <div>Level: <b id="level">1</b></div>
    <div>Score: <b id="score">0</b></div>
    <div>Lives: <b id="lives">3</b></div>
    <button onclick="newGame()">Restart</button>
  </div>
</div>

<div id="questionBox">
  <div id="qCard">
    <p id="questionText"></p>
    <div id="answers"></div>
  </div>
</div>

<script>
let tile=30, cols=20, rows=16;
let maze;
let score=0;
let level=1;
let lives=3;

let target={x:1,y:1}, render={x:1,y:1};
let enemies=[];

const canvas=document.getElementById('game');
canvas.width=cols*tile;
canvas.height=rows*tile;
const ctx=canvas.getContext('2d');

const menu=document.getElementById('menu');
const wrap=document.getElementById('wrap');

const levelEl=document.getElementById('level');
const scoreEl=document.getElementById('score');
const livesEl=document.getElementById('lives');

function updateUI(){
  levelEl.textContent=level;
  scoreEl.textContent=score;
  livesEl.textContent=lives;
}

let soundOn=true;
const bgMusic=new Audio("https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8a2b3b8f1.mp3");
bgMusic.loop=true;

const sfxMove=new Audio("https://cdn.pixabay.com/download/audio/2022/03/15/audio_5c8e4d7c1a.mp3");
const sfxCorrect=new Audio("https://cdn.pixabay.com/download/audio/2022/03/15/audio_7a8b1e4c0a.mp3");
const sfxWrong=new Audio("https://cdn.pixabay.com/download/audio/2022/03/15/audio_3a9f7c2b3d.mp3");
const sfxWin=new Audio("https://cdn.pixabay.com/download/audio/2022/03/15/audio_0b2d3c4e5f.mp3");

function play(a){if(!soundOn)return;a.currentTime=0;a.play().catch(()=>{});}
function unlockAudio(){bgMusic.play().then(()=>bgMusic.pause()).catch(()=>{});}
function startMusic(){if(soundOn)bgMusic.play().catch(()=>{});}

const questionBox=document.getElementById('questionBox');
const questionText=document.getElementById('questionText');
const answers=document.getElementById('answers');

let questions=[
{q:"A step-by-step set of instructions for solving a problem.",a:["Algorithm","Value","String"],c:0},
{q:"A specific piece of data a program stores or uses.",a:["Value","Variable","Number"],c:0},
{q:"The category of data a value belongs to.",a:["Data Type","List","Boolean"],c:0},
{q:"A numeric data type used for math calculations.",a:["Number","String","Boolean"],c:0},
{q:"A sequence of characters used to represent text.",a:["String","Number","Boolean"],c:0},
{q:"A data type with only two values true or false.",a:["Boolean","Value","Variable"],c:0},
{q:"A named container that stores a value.",a:["Variable","List","Index"],c:0},
{q:"The = symbol used to assign values.",a:["Assignment Operator","Comparison Operators","Logical Operators"],c:0},
{q:"Giving a variable a value.",a:["Variable Assignment","Function Call","Event"],c:0},
{q:"An ordered collection of values.",a:["List","Element","String"],c:0},
{q:"A value inside a list.",a:["Element","Index","Variable"],c:0},
{q:"Position in a list starting at 0.",a:["Index","Number","Element"],c:0},
{q:"Math expression result.",a:["Expression","Condition","Comment"],c:0},
{q:"Math symbols.",a:["Arithmetic Operators","Logical Operators","Comparison Operators"],c:0},
{q:"Remainder after division.",a:["% (Modulus)","Addition","Multiplication"],c:0},
{q:"Compare values true/false.",a:["Comparison Operators","Arithmetic Operators","List"],c:0},
{q:"Boolean logic symbols.",a:["Logical Operators","String","Number"],c:0},
{q:"Joining strings.",a:["Concatenation","Index","Function"],c:0},
{q:"True/false control question.",a:["Condition","Variable","String"],c:0},
{q:"Runs different code based on condition.",a:["Conditional Statement","Loop","Event"],c:0},
{q:"Counting pattern.",a:["Counter Pattern","List","Variable Assignment"],c:0},
{q:"Reusable block of code.",a:["Function","Function Call","Event"],c:0},
{q:"Runs a function.",a:["Function Call","Function","Index"],c:0},
{q:"Triggers code.",a:["Event","Action","Variable"],c:0},
{q:"Waits for event.",a:["Event Handler","Function","String"],c:0},
{q:"Program response.",a:["Action","Condition","List"],c:0},
{q:"Note in code.",a:["Comment","Variable","Number"],c:0},
{q:"Fixing errors.",a:["Debugging","String","Value"],c:0}
];

function generate(){
  let m=Array.from({length:rows},()=>Array(cols).fill(0));

  function carve(x,y){
    let dirs=[[2,0],[-2,0],[0,2],[0,-2]].sort(()=>Math.random()-0.5);
    for(let [dx,dy] of dirs){
      let nx=x+dx,ny=y+dy;
      if(nx>0&&ny>0&&nx<cols-1&&ny<rows-1&&m[ny][nx]===0){
        m[y+dy/2][x+dx/2]=1;
        m[ny][nx]=1;
        carve(nx,ny);
      }
    }
  }

  m[1][1]=1;
  carve(1,1);

  let ex=cols-2,ey=rows-2;
  m[ey][ex]=4;

  for(let i=0;i<25;i++){
    let x=Math.floor(Math.random()*cols);
    let y=Math.floor(Math.random()*rows);
    if(m[y][x]===1 && !(x===1&&y===1) && !(x===ex&&y===ey)) m[y][x]=2;
  }

  return m;
}

function initEnemies(){
  enemies=[];
  for(let i=0;i<3;i++) enemies.push({x:2+i,y:2});
}

function updateEnemies(){
  for(let e of enemies){
    let dx=target.x-e.x;
    let dy=target.y-e.y;
    let moved=false;

    if(Math.abs(dx)>Math.abs(dy)){
      if(dx!==0 && maze[e.y]?.[e.x+Math.sign(dx)]!==0){e.x+=Math.sign(dx); moved=true;}
      if(!moved && dy!==0 && maze[e.y+Math.sign(dy)]?.[e.x]!==0){e.y+=Math.sign(dy); moved=true;}
    } else {
      if(dy!==0 && maze[e.y+Math.sign(dy)]?.[e.x]!==0){e.y+=Math.sign(dy); moved=true;}
      if(!moved && dx!==0 && maze[e.y]?.[e.x+Math.sign(dx)]!==0){e.x+=Math.sign(dx); moved=true;}
    }

    if(!moved){
      let dirs=[[1,0],[-1,0],[0,1],[0,-1]].sort(()=>Math.random()-0.5);
      for(let [ax,ay] of dirs){
        if(maze[e.y+ay]?.[e.x+ax]!==0){e.x+=ax;e.y+=ay;break;}
      }
    }

    if(e.x===target.x&&e.y===target.y){
      lives--;
      updateUI();
      target={x:1,y:1};render={x:1,y:1};
      if(lives<=0){alert("Game Over");newGame();}
    }
  }
}

function draw(){
  if(!maze){requestAnimationFrame(draw);return;}

  render.x+=(target.x-render.x)*0.25;
  render.y+=(target.y-render.y)*0.25;

  updateEnemies();

  ctx.clearRect(0,0,canvas.width,canvas.height);

  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    ctx.fillStyle=maze[y][x]===0?"#000":maze[y][x]===4?"#0f0":maze[y][x]===2?"orange":"#444";
    ctx.fillRect(x*tile,y*tile,tile,tile);
  }

  ctx.fillStyle="red";
  enemies.forEach(e=>ctx.fillRect(e.x*tile,e.y*tile,tile,tile));

  ctx.fillStyle="cyan";
  ctx.fillRect(render.x*tile,render.y*tile,tile,tile);

  requestAnimationFrame(draw);
}

function move(dx,dy){
  let nx=target.x+dx,ny=target.y+dy;
  let t=maze[ny]?.[nx];
  if(t===0||t==null) return;

  if(t===2){ask(nx,ny);return;}

  target={x:nx,y:ny};
  play(sfxMove);

  if(t===4){level++;updateUI();play(sfxWin);alert("Level Complete");newGame();}
}

function ask(x,y){
  let q=questions[Math.floor(Math.random()*questions.length)];
  questionBox.style.display="flex";
  questionText.textContent=q.q;
  answers.innerHTML="";

  q.a.forEach((ans,i)=>{
    let b=document.createElement("button");
    b.textContent=ans;
    b.onclick=()=>{
      if(i===q.c){maze[y][x]=1;score+=10;play(sfxCorrect);}else{play(sfxWrong);}
      updateUI();questionBox.style.display="none";
    };
    answers.appendChild(b);
  });
}

function newGame(){
  maze=generate();
  target={x:1,y:1};render={x:1,y:1};
  lives=3;score=0;
  updateUI();initEnemies();
}

function startGame(){
  unlockAudio();
  menu.style.display="none";
  wrap.style.display="flex";
  newGame();
  startMusic();
}

window.startGame=startGame;
window.newGame=newGame;

addEventListener("keydown",e=>{
  if(questionBox.style.display==="flex")return;
  if(e.key==="ArrowUp"||e.key==="w")move(0,-1);
  if(e.key==="ArrowDown"||e.key==="s")move(0,1);
  if(e.key==="ArrowLeft"||e.key==="a")move(-1,0);
  if(e.key==="ArrowRight"||e.key==="d")move(1,0);
});

requestAnimationFrame(draw);
</script>
</body>
</html>
