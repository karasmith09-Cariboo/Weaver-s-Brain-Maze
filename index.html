<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<title>Weaver's Brain Maze+</title>
<style>
body{margin:0;background:#0b1020;color:#e5e7eb;font-family:system-ui;text-align:center}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0b1020;z-index:10}
#wrap{display:none;justify-content:center;gap:16px;padding:10px}
canvas{background:#000;border-radius:12px}
.panel{background:#111827;padding:10px;border-radius:10px;min-width:140px}
button{padding:10px;margin:5px;border:0;border-radius:8px;cursor:pointer}
.primary{background:#22c55e;font-weight:bold}
#questionBox{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.7);z-index:20}
#qCard{background:white;color:black;padding:18px;border-radius:12px;width:300px}
</style>
</head>
<body>

<div id="menu">
  <h1>🧠 Weaver's Brain Maze+</h1>
  <h3>Created by Kara Smith</h3>
  <button id="playBtn" class="primary">Play</button>
</div>

<div id="wrap">
  <canvas id="game"></canvas>
  <div class="panel">
    <div>Level: <b id="level">1</b></div>
    <div>Score: <b id="score">0</b></div>
    <div>Lives: <b id="lives">3</b></div>
    <button onclick="newGame()">Restart</button>
  </div>
</div>

<div id="questionBox">
  <div id="qCard">
    <p id="questionText"></p>
    <div id="answers"></div>
  </div>
</div>

<script>
let tile=30, cols=20, rows=16;
let maze;
let score=0, level=1, lives=3;
let target={x:1,y:1}, render={x:1,y:1};

const canvas=document.getElementById('game');
canvas.width=cols*tile;
canvas.height=rows*tile;
const ctx=canvas.getContext('2d');

const menu=document.getElementById('menu');
const wrap=document.getElementById('wrap');

const levelEl=document.getElementById('level');
const scoreEl=document.getElementById('score');
const livesEl=document.getElementById('lives');

function updateUI(){
  levelEl.textContent=level;
  scoreEl.textContent=score;
  livesEl.textContent=lives;
}

const questionBox=document.getElementById('questionBox');
const questionText=document.getElementById('questionText');
const answers=document.getElementById('answers');

function generate(){
  let m=Array.from({length:rows},()=>Array(cols).fill(0));

  function carve(x,y){
    let dirs=[[2,0],[-2,0],[0,2],[0,-2]].sort(()=>Math.random()-0.5);
    for(let [dx,dy] of dirs){
      let nx=x+dx,ny=y+dy;
      if(nx>0&&ny>0&&nx<cols-1&&ny<rows-1&&m[ny][nx]===0){
        m[y+dy/2][x+dx/2]=1;
        m[ny][nx]=1;
        carve(nx,ny);
      }
    }
  }

  m[1][1]=1;
  carve(1,1);

  let ex=cols-2,ey=rows-2;
  m[ey][ex]=4;

  return m;
}

function draw(){
  if(!maze){requestAnimationFrame(draw);return;}

  render.x+=(target.x-render.x)*0.25;
  render.y+=(target.y-render.y)*0.25;

  ctx.clearRect(0,0,canvas.width,canvas.height);

  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    ctx.fillStyle=maze[y][x]===0?"#000":maze[y][x]===4?"#0f0":"#444";
    ctx.fillRect(x*tile,y*tile,tile,tile);
  }

  ctx.fillStyle="cyan";
  ctx.fillRect(render.x*tile,render.y*tile,tile,tile);

  requestAnimationFrame(draw);
}

function move(dx,dy){
  let nx=target.x+dx,ny=target.y+dy;
  let t=maze[ny]?.[nx];
  if(t===0||t==null) return;

  target={x:nx,y:ny};

  if(t===4){
    level++;updateUI();alert("Level Complete");newGame();
  }
}

function newGame(){
  maze=generate();
  target={x:1,y:1};render={x:1,y:1};
  score=0;lives=3;
  updateUI();
}

function startGame(){
  menu.style.display="none";
  wrap.style.display="flex";
  newGame();
}

document.getElementById('playBtn').addEventListener('click',startGame);

addEventListener("keydown",e=>{
  if(questionBox.style.display==="flex")return;
  if(e.key==="ArrowUp"||e.key==="w")move(0,-1);
  if(e.key==="ArrowDown"||e.key==="s")move(0,1);
  if(e.key==="ArrowLeft"||e.key==="a")move(-1,0);
  if(e.key==="ArrowRight"||e.key==="d")move(1,0);
});

requestAnimationFrame(draw);
</script>
</body>
</html>
