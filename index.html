<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<title>Weaver's Brain Maze+</title>
<style>
body{margin:0;background:#0b1020;color:#e5e7eb;font-family:system-ui;text-align:center}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0b1020;z-index:999}
#wrap{display:none;justify-content:center;gap:16px;padding:10px}
canvas{background:#000;border-radius:12px}
.panel{background:#111827;padding:10px;border-radius:10px;min-width:140px}
button{padding:10px;margin:5px;border:0;border-radius:8px;cursor:pointer}
.primary{background:#22c55e;font-weight:bold}
#questionBox{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.7);z-index:20}
#qCard{background:white;color:black;padding:18px;border-radius:12px;width:320px}
#infoLink{position:fixed;bottom:10px;width:100%;text-align:center;font-size:14px;color:#93c5fd;cursor:pointer;z-index:50}
#infoModal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.85);z-index:100}
#infoCard{background:#111827;color:#e5e7eb;padding:20px;border-radius:12px;width:80%;max-width:500px;text-align:left}
</style>
</head>
<body>

<div id="menu">
  <h1>🧠 Weaver's Brain Maze+</h1>
  <h3>Created by Kara Smith</h3>
  <button id="playBtn" class="primary">Play</button>
</div>

<div id="wrap">
  <canvas id="game"></canvas>
  <div class="panel">
    <div>Level: <b id="level">1</b></div>
    <div>Score: <b id="score">0</b></div>
    <div>Lives: <b id="lives">3</b></div>
    <button onclick="newGame()">Restart</button>
  </div>
</div>

<div id="questionBox">
  <div id="qCard">
    <p id="questionText"></p>
    <div id="answers"></div>
  </div>
</div>

<div id="infoLink" onclick="openInfo()">📘 Read How I Built This</div>

<div id="infoModal">
  <div id="infoCard">
    <h2>How I Built This</h2>
    <p>Maze generated using randomized depth-first search.</p>
    <p>Doors require answering coding vocabulary questions.</p>
    <p>Exit is always placed on a reachable path tile.</p>
    <button onclick="closeInfo()">Close</button>
  </div>
</div>

<script>
let tile=30, cols=20, rows=16;
let maze;
let score=0, level=1, lives=3;
let player={x:1,y:1}, view={x:1,y:1};

const canvas=document.getElementById('game');
canvas.width=cols*tile;
canvas.height=rows*tile;
const ctx=canvas.getContext('2d');

const menu=document.getElementById('menu');
const wrap=document.getElementById('wrap');
const playBtn=document.getElementById('playBtn');

const levelEl=document.getElementById('level');
const scoreEl=document.getElementById('score');
const livesEl=document.getElementById('lives');

function updateUI(){
  levelEl.textContent=level;
  scoreEl.textContent=score;
  livesEl.textContent=lives;
}

const questionBox=document.getElementById('questionBox');
const questionText=document.getElementById('questionText');
const answers=document.getElementById('answers');

const questions=[
{q:"A step-by-step set of instructions for solving a problem.",a:["Algorithm","Value","String"],c:0},
{q:"A specific piece of data a program stores or uses.",a:["Value","Variable","Number"],c:0},
{q:"The category of data a value belongs to.",a:["Data Type","List","Boolean"],c:0},
{q:"A numeric data type used for math calculations.",a:["Number","String","Boolean"],c:0},
{q:"A sequence of characters used to represent text.",a:["String","Number","Boolean"],c:0},
{q:"A data type with only true/false values.",a:["Boolean","Value","Variable"],c:0},
{q:"A named container that stores a value.",a:["Variable","List","Index"],c:0},
{q:"The = symbol used for assignment.",a:["Assignment Operator","Comparison Operators","Logical Operators"],c:0},
{q:"Giving a variable a value.",a:["Variable Assignment","Function Call","Event"],c:0},
{q:"An ordered collection of values.",a:["List","Element","String"],c:0},
{q:"A value inside a list.",a:["Element","Index","Variable"],c:0},
{q:"Position in a list starting at 0.",a:["Index","Number","Element"],c:0},
{q:"A combination of values and operators.",a:["Expression","Condition","Comment"],c:0},
{q:"Math symbols for numbers.",a:["Arithmetic Operators","Logical Operators","Comparison Operators"],c:0},
{q:"Remainder after division.",a:["% (Modulus)","Addition","Multiplication"],c:0},
{q:"Symbols that compare values.",a:["Comparison Operators","Arithmetic Operators","List"],c:0},
{q:"Symbols that combine booleans.",a:["Logical Operators","String","Number"],c:0},
{q:"Joining strings together.",a:["Concatenation","Index","Function"],c:0},
{q:"True/false control question.",a:["Condition","Variable","String"],c:0},
{q:"Code that runs based on condition.",a:["Conditional Statement","Loop","Event"],c:0},
{q:"Updating a value repeatedly.",a:["Counter Pattern","List","Variable Assignment"],c:0},
{q:"Reusable block of code.",a:["Function","Function Call","Event"],c:0},
{q:"Command that runs a function.",a:["Function Call","Function","Index"],c:0},
{q:"An action that triggers code.",a:["Event","Action","Variable"],c:0},
{q:"Code that waits for an event.",a:["Event Handler","Function","String"],c:0},
{q:"Program response to an event.",a:["Action","Condition","List"],c:0},
{q:"A note ignored by program.",a:["Comment","Variable","Number"],c:0},
{q:"Finding and fixing errors.",a:["Debugging","String","Value"],c:0}
];

function generate(){
  let m=Array.from({length:rows},()=>Array(cols).fill(0));

  function carve(x,y){
    let dirs=[[2,0],[-2,0],[0,2],[0,-2]].sort(()=>Math.random()-0.5);
    for(let [dx,dy] of dirs){
      let nx=x+dx,ny=y+dy;
      if(nx>0&&ny>0&&nx<cols-1&&ny<rows-1&&m[ny][nx]===0){
        m[y+dy/2][x+dx/2]=1;
        m[ny][nx]=1;
        carve(nx,ny);
      }
    }
  }

  m[1][1]=1;
  carve(1,1);

  let candidates=[];
  for(let y=1;y<rows-1;y++){
    for(let x=1;x<cols-1;x++){
      if(m[y][x]===1 && !(x===1&&y===1)) candidates.push({x,y});
    }
  }

  let pick=candidates[Math.floor(Math.random()*candidates.length)]||{x:cols-2,y:rows-2};
  let ex=pick.x, ey=pick.y;

  for(let i=0;i<25;i++){
    let x=Math.floor(Math.random()*cols);
    let y=Math.floor(Math.random()*rows);
    if(m[y][x]===1 && !(x===1&&y===1) && !(x===ex&&y===ey)) m[y][x]=2;
  }

  const dirs4=[[1,0],[-1,0],[0,1],[0,-1]];
  for(let [dx,dy] of dirs4){
    let nx=ex+dx,ny=ey+dy;
    if(nx>0&&ny>0&&nx<cols-1&&ny<rows-1) m[ny][nx]=1;
  }

  m[ey][ex]=4;

  return m;
}

function askDoor(x,y){
  let q=questions[Math.floor(Math.random()*questions.length)];
  questionBox.style.display="flex";
  questionText.textContent=q.q;
  answers.innerHTML="";

  q.a.forEach((ans,i)=>{
    let b=document.createElement("button");
    b.textContent=ans;
    b.onclick=()=>{
      if(i===q.c){maze[y][x]=1;player={x,y};score+=10;}
      questionBox.style.display="none";
      updateUI();
    };
    answers.appendChild(b);
  });
}

function draw(){
  if(!maze){requestAnimationFrame(draw);return;}

  view.x+=(player.x-view.x)*0.2;
  view.y+=(player.y-view.y)*0.2;

  ctx.clearRect(0,0,canvas.width,canvas.height);

  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    let t=maze[y][x];
    ctx.fillStyle=t===0?"#000":t===4?"#0f0":t===2?"orange":"#444";
    ctx.fillRect(x*tile,y*tile,tile,tile);
  }

  ctx.fillStyle="cyan";
  ctx.fillRect(view.x*tile,view.y*tile,tile,tile);

  requestAnimationFrame(draw);
}

function move(dx,dy){
  let nx=player.x+dx,ny=player.y+dy;
  let t=maze[ny]?.[nx];
  if(t===0||t==null) return;

  if(t===2){askDoor(nx,ny);return;}

  player={x:nx,y:ny};

  if(t===4){level++;updateUI();alert("Level Complete!");newGame();}
}

function newGame(){
  maze=generate();
  player={x:1,y:1};view={x:1,y:1};
  score=0;lives=3;
  updateUI();
}

function startGame(){
  menu.style.display="none";
  wrap.style.display="flex";
  newGame();
}

function openInfo(){document.getElementById('infoModal').style.display='flex';}
function closeInfo(){document.getElementById('infoModal').style.display='none';}

// FIX: movement controls restored
addEventListener('keydown',(e)=>{
  if(questionBox.style.display==='flex') return;
  if(e.key==='ArrowUp'||e.key==='w') move(0,-1);
  if(e.key==='ArrowDown'||e.key==='s') move(0,1);
  if(e.key==='ArrowLeft'||e.key==='a') move(-1,0);
  if(e.key==='ArrowRight'||e.key==='d') move(1,0);
});

playBtn.addEventListener('click',startGame);
requestAnimationFrame(draw);
</script>
</body>
</html>
